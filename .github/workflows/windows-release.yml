name: Windows Release Build

on:
  push:
    branches: [ master, 'cursor/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore NuGet (if any)
        run: |
          if (Test-Path "*.sln") {
            nuget restore LaserGRBL.sln -NonInteractive
          }
        continue-on-error: true

      - name: Build Release
        run: |
          msbuild LaserGRBL.sln /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.8 /m /v:minimal

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "artifacts/LaserGRBL-knife-portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "LaserGRBL\bin\Release\*" $out -Recurse -Force
          Compress-Archive -Path "$out\*" -DestinationPath "artifacts/LaserGRBL-knife-portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        continue-on-error: true

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Warning "ISCC.exe not found — skipping installer"
            exit 0
          }
          & $iscc "setup-knife.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: LaserGRBL-knife-portable
          path: artifacts/LaserGRBL-knife-portable.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LaserGRBL-knife-setup
          path: artifacts/LaserGRBL-knife-setup.exe
          if-no-files-found: warn

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LaserGRBL-knife-portable.zip
            artifacts/LaserGRBL-knife-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
