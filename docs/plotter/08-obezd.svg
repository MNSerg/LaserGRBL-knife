<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <rect width="900" height="450" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">8. Две отдельные фигуры: нож обходит первую</text>
  <rect x="160" y="100" width="210" height="150" fill="#d9e6f5" stroke="#1d4e89" stroke-width="3"/>
  <text x="200" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1d4e89">уже вырезано</text>
  <rect x="500" y="110" width="190" height="140" fill="#ffffff" stroke="#1d4e89" stroke-width="3"/>
  <text x="545" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1d4e89">следующая</text>
  <line x1="260" y1="170" x2="500" y2="180" stroke="#c4372f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="300" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c4372f">прямая прорезала бы первую фигуру</text>
  <path d="M260 250 L260 340 L500 340 L500 250" fill="none" stroke="#e07a2f" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c45c26">объезд по прямоугольнику вокруг фигуры</text>
  <text x="24" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Между фигурами запас объезда примерно равен длине лезвия.</text>
  <text x="24" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Открытый штрих дорогу не закрывает: сквозь него нож может пройти.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#e07a2f"/></marker>
  </defs>
</svg>