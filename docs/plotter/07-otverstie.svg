<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
  <rect width="820" height="470" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">7. Рамка и дырка</text>
  <rect x="200" y="80" width="440" height="290" fill="#d9e6f5" stroke="#1d4e89" stroke-width="4"/>
  <rect x="360" y="170" width="170" height="120" fill="#fbf7f1" stroke="#1d4e89" stroke-width="4"/>
  <circle cx="200" cy="370" r="18" fill="#e07a2f"/>
  <text x="192" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="36" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c45c26">сначала вся</text>
  <text x="36" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c45c26">внешняя рамка</text>
  <line x1="250" y1="360" x2="360" y2="250" stroke="#c4372f" stroke-width="3" stroke-dasharray="8 5"/>
  <circle cx="310" cy="300" r="16" fill="#c4372f"/>
  <text x="303" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <circle cx="445" cy="230" r="18" fill="#1f8a4c"/>
  <text x="437" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <text x="548" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#145c34">потом контур</text>
  <text x="548" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#145c34">дырки</text>
  <text x="24" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Красный пунктир — разрез по резине. Нож не поднимается и не может перепрыгнуть в окно.</text>
  <text x="24" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Галочка «сначала отверстия» не ставит такую дырку первой: снаружи к ней нет подъезда мимо рамки.</text>
</svg>