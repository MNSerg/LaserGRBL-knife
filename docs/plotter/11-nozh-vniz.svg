<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">11. Высота вручную и нож, который умеет подниматься</text>
  <rect x="24" y="64" width="370" height="220" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="40" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Высота вручную</text>
  <rect x="70" y="130" width="120" height="80" fill="#d9e6f5" stroke="#1d4e89" stroke-width="3"/>
  <rect x="230" y="140" width="120" height="80" fill="#ffffff" stroke="#1d4e89" stroke-width="3"/>
  <path d="M130 210 L130 250 L230 250 L230 220" fill="none" stroke="#e07a2f" stroke-width="3"/>
  <text x="40" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Переезд — сплошной рез. Команд G0 нет.</text>
  <rect x="430" y="64" width="440" height="230" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="436" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Серво, соленоид или ось Z</text>
  <rect x="470" y="130" width="120" height="80" fill="#d9e6f5" stroke="#1d4e89" stroke-width="3"/>
  <rect x="630" y="140" width="120" height="80" fill="#ffffff" stroke="#1d4e89" stroke-width="3"/>
  <path d="M530 170 L690 180" fill="none" stroke="#7a6f64" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="436" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Пунктир — нож поднят. Резину не режет,</text>
  <text x="436" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">даже если линия идёт поверх детали.</text>
  <text x="24" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">«Поднимать нож свыше … градусов» в ручном режиме не действует.</text>
  <text x="24" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Нож на углу не поднимается ни при каком числе в этой строке.</text>
  <text x="24" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Если подъём есть, большое число заставляет на крутом углу поднять нож и зайти на новую сторону заново.</text>
</svg>