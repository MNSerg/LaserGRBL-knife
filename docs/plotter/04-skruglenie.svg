<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">4. Скругление остаётся скруглением, прямой угол — нет</text>
  <rect x="24" y="70" width="370" height="270" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="40" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Плавный поворот</text>
  <text x="40" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">каждый шажок меньше 8°</text>
  <path d="M50 280 C 100 280, 130 250, 160 200 S 240 100, 360 90" fill="none" stroke="#1d4e89" stroke-width="4"/>
  <path d="M70 300 C 120 300, 148 268, 176 220 S 254 118, 370 108" fill="none" stroke="#e07a2f" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="40" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Дуги разворота нет. Ось повторяет кривую.</text>
  <rect x="430" y="70" width="440" height="280" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="436" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Один угол 90°</text>
  <text x="436" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">поворот больше порога</text>
  <path d="M460 280 L600 280 L600 120" fill="none" stroke="#1d4e89" stroke-width="4"/>
  <path d="M500 280 L680 280 A80 80 0 0 0 600 200 L600 180" fill="none" stroke="#e07a2f" stroke-width="3"/>
  <circle cx="600" cy="280" r="6" fill="#1f8a4c"/>
  <text x="446" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Остриё на углу, ось идёт дугой снаружи.</text>
  <text x="24" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Синяя линия — остриё и рисунок. Оранжевая — ось, её показывает программа.</text>
  <text x="24" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Порог 0° ставит дугу на каждый шорох, нож дёргается на гладкой кривой.</text>
  <text x="24" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Порог 90° и выше оставляет прямой угол без дуги, и угол детали скругляется.</text>
</svg>