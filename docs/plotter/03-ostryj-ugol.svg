<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">3. Прямой угол: остриё стоит, держатель описывает дугу</text>
  <text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c5146">Поворот круче порога «Острый угол от». По умолчанию порог 8°, прямой угол его проходит.</text>
  <rect x="80" y="90" width="300" height="210" fill="#d9e6f5" stroke="#1d4e89" stroke-width="4"/>
  <text x="180" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1d4e89">деталь</text>
  <circle cx="380" cy="300" r="8" fill="#1f8a4c"/>
  <text x="250" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#145c34">остриё стоит на углу</text>
  <circle cx="500" cy="300" r="8" fill="#e07a2f"/>
  <circle cx="380" cy="180" r="8" fill="#e07a2f"/>
  <path d="M500 300 A120 120 0 0 0 380 180" fill="none" stroke="#e07a2f" stroke-width="4"/>
  <path d="M380 300 L500 300 A120 120 0 0 0 380 180 Z" fill="#e07a2f" opacity="0.16"/>
  <text x="520" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c45c26">дуга оси</text>
  <text x="520" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">радиус = смещение</text>
  <path d="M140 300 L340 300" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <text x="170" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1d4e89">приехали вдоль стороны</text>
  <path d="M380 250 L380 120" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1d4e89">дальше вверх</text>
  <text x="24" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Угол детали остаётся острым. Оранжевый сектор тоже прорезается:</text>
  <text x="24" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">лезвие — палочка от оси до острия, и на повороте она прометает этот сектор.</text>
  <text x="24" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">На внешнем контуре сектор уходит в обрезь. На дырке он может задеть деталь у угла.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#1d4e89"/>
    </marker>
  </defs>
</svg>