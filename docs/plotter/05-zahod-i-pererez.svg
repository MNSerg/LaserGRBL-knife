<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
  <rect width="820" height="470" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">5. Замкнутый контур: заход до шва и перерез после него</text>
  <rect x="230" y="100" width="360" height="230" fill="#d9e6f5" stroke="#1d4e89" stroke-width="4"/>
  <line x1="110" y1="330" x2="230" y2="330" stroke="#1f8a4c" stroke-width="5"/>
  <circle cx="110" cy="330" r="7" fill="#1f8a4c"/>
  <circle cx="230" cy="330" r="6" fill="#1d4e89"/>
  <text x="28" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#145c34">заход</text>
  <text x="28" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">остриё выравнивается</text>
  <text x="28" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">ещё до рисунка</text>
  <path d="M270 330 L550 330" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <path d="M590 290 L590 140" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <path d="M550 100 L270 100" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 140 L230 290" fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="352" x2="370" y2="352" stroke="#c4372f" stroke-width="5"/>
  <path d="M350 352 L370 352" fill="none" stroke="#c4372f" stroke-width="5" marker-end="url(#b)"/>
  <text x="390" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c4372f">перерез</text>
  <text x="390" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">ещё раз по началу стороны,</text>
  <text x="390" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">чтобы в углу не остался хвостик</text>
  <text x="24" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">По умолчанию заход и перерез равны смещению: 3,6 мм. Оба куска нож прорезает, он уже в резине.</text>
  <text x="24" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Если первая сторона короче перереза, хвост уезжает дальше следующего угла по прямой.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#1d4e89"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#c4372f"/></marker>
  </defs>
</svg>