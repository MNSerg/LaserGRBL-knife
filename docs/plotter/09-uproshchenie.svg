<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#fbf7f1"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c2416">9. Упрощение правит рисунок раньше, чем лезвие</text>
  <rect x="24" y="64" width="370" height="250" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="40" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Допуск 0,05 мм</text>
  <path d="M50 230 L90 190 L125 235 L160 170 L195 220 L235 150 L275 210 L350 140" fill="none" stroke="#1d4e89" stroke-width="3"/>
  <text x="40" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Зубцы живы. Острые из них получат дугу.</text>
  <rect x="430" y="64" width="440" height="270" fill="#ffffff" stroke="#e4d8c8"/>
  <text x="436" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c2416">Допуск 2 мм</text>
  <path d="M470 300 L820 240" fill="none" stroke="#1d4e89" stroke-width="3"/>
  <text x="450" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Мелочь стала прямой.</text>
  <text x="450" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">Скруглённый угол может стать одним острым,</text>
  <text x="450" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c5146">и тогда на нём появится дуга разворота.</text>
  <text x="24" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">«Мин. отрезок» выкидывает точки, которые ближе заданного.</text>
  <text x="24" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Большое число съедает узкую щель и короткую сторону.</text>
  <text x="24" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2c2416">Оба числа работают до компенсации лезвия. Пропавший угол они уже не вернут.</text>
</svg>